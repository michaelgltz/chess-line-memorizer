<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Recall64 chess opening trainer</title>
  <desc id="description">Recall64 logo with the words Practice openings. Play beyond them.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1200" y1="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07110d" />
      <stop offset="0.55" stop-color="#101827" />
      <stop offset="1" stop-color="#0d251b" />
    </linearGradient>
    <linearGradient id="green" x1="160" x2="450" y1="130" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86efac" />
      <stop offset="0.55" stop-color="#22c55e" />
      <stop offset="1" stop-color="#15803d" />
    </linearGradient>
    <pattern id="board" width="72" height="72" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#f8fafc" opacity="0.035" />
      <rect x="36" y="36" width="36" height="36" fill="#f8fafc" opacity="0.035" />
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" flood-color="#000000" flood-opacity="0.34" stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
  <rect width="1200" height="630" fill="url(#board)" />
  <circle cx="1070" cy="55" r="290" fill="#22c55e" opacity="0.055" />
  <circle cx="1080" cy="610" r="360" fill="#86efac" opacity="0.035" />

  <g filter="url(#shadow)">
    <rect x="96" y="93" width="390" height="390" rx="82" fill="#101827" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3" />
    <path d="M392 203A145 145 0 1 0 401 364" fill="none" stroke="url(#green)" stroke-linecap="round" stroke-width="25" />
    <path d="m354 354 50 17 14-51" fill="none" stroke="#22c55e" stroke-linecap="round" stroke-linejoin="round" stroke-width="25" />
    <circle cx="291" cy="181" r="51" fill="#f8fafc" />
    <path d="M237 280c0-30 24-54 54-54s54 24 54 54c0 23-14 42-33 50l22 54h-86l22-54c-20-8-33-27-33-50Z" fill="#f8fafc" stroke="#101827" stroke-linejoin="round" stroke-width="10" />
    <path d="M223 384h137c14 0 25 11 25 25v20H198v-20c0-14 11-25 25-25Z" fill="#f8fafc" />
    <path d="M204 429h173c15 0 28 12 30 27H174c2-15 15-27 30-27Z" fill="url(#green)" />
  </g>

  <text x="555" y="253" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="104" font-weight="760" letter-spacing="-4">Recall64</text>
  <text x="561" y="322" fill="#86efac" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="700" letter-spacing="1">PRIVATE CHESS OPENING TRAINER</text>
  <text x="561" y="392" fill="#d7e2dc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="500">Practice openings. Play beyond them.</text>
  <rect x="562" y="435" width="114" height="7" rx="3.5" fill="url(#green)" />
</svg>
